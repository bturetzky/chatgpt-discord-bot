name: Docker Build and Push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main or version tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Propose and auto-merge development deployment
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: bturetzky
          repositories: homelab-gitops

      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: bturetzky/homelab-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: true

      - name: Update development image to published digest
        working-directory: gitops
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          digest = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit(f"Unexpected image digest: {digest}")
          path = Path("apps/discord/dev/deployment.yaml")
          source = path.read_text()
          updated, count = re.subn(
              r"(?m)^(\s*image:\s*)ghcr\.io/bturetzky/chatgpt-discord-bot(?::[^\s]+|@sha256:[a-f0-9]{64})\s*$",
              lambda match: match.group(1) + "ghcr.io/bturetzky/chatgpt-discord-bot@" + digest,
              source,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one dev bot image, found {count}")
          path.write_text(updated)
          PY

      - name: Open and enable auto-merge for GitOps PR
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/discord/dev/deployment.yaml; then
            echo "Dev already references this image digest."
            exit 0
          fi
          branch="automation/discord-dev-${SOURCE_SHA:0:12}"
          git config user.name "discord-gitops[bot]"
          git config user.email "discord-gitops[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/discord/dev/deployment.yaml
          git commit -m "gitops(discord-dev): deploy ${SOURCE_SHA:0:12}"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --repo bturetzky/homelab-gitops --base main --head "$branch" \
            --title "gitops(discord-dev): deploy bot ${SOURCE_SHA:0:12}" \
            --body "Automated dev-only deployment from [bot commit](https://github.com/bturetzky/chatgpt-discord-bot/commit/$SOURCE_SHA). Image: \`ghcr.io/bturetzky/chatgpt-discord-bot@$IMAGE_DIGEST\`. Production unchanged.")"
          echo "Created $pr_url"
          gh pr merge "$pr_url" --squash --auto --delete-branch
